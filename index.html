<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ular Bakso</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="gameWrap">
<canvas id="gameCanvas"></canvas>
<div id="menu" class="overlay"><div class="panel menu-panel">
<h1>ULAR BAKSO</h1><h2>Cara Bermain</h2>
<p>• Gunakan panah / WASD untuk bergerak</p><p>• Makan makanan untuk menambah skor</p><p>• Hindari dinding dan tubuh ular sendiri</p>
<button id="startBtn">MULAI</button></div></div>
<div id="pause" class="overlay hidden"><div class="panel small-panel"><h2>PAUSED</h2><p>Tekan P untuk melanjutkan.</p></div></div>
<div id="gameover" class="overlay hidden"><div class="panel small-panel"><h2>GAME OVER</h2><p>Tekan ENTER atau tombol di bawah untuk main lagi.</p><button id="restartBtn">MAIN LAGI</button></div></div>
<div id="mobileControls">
<button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button>
</div>
</main>
<script src="script.js"></script>
</body></html>
