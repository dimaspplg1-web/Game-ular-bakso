<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ular Bakso</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameWrap">
  <canvas id="gameCanvas"></canvas>

  <section id="menu" class="overlay">
    <div class="panel menu-panel">
      <h1>ULAR BAKSO</h1>
      <h2>Cara Bermain</h2>
      <div class="instructions">
        <p>• Gunakan panah / WASD untuk bergerak</p>
        <p>• Makan makanan untuk menambah skor</p>
        <p>• Hindari dinding dan tubuh ular sendiri</p>
      </div>
      <button id="startBtn">MULAI</button>
    </div>
  </section>

  <section id="pause" class="overlay hidden">
    <div class="panel small-panel">
      <h2>PAUSED</h2>
      <p>Tekan P untuk melanjutkan.</p>
    </div>
  </section>

  <section id="gameover" class="overlay hidden">
    <div class="panel small-panel">
      <h2>GAME OVER</h2>
      <p>Tekan ENTER atau tombol di bawah untuk main lagi.</p>
      <button id="restartBtn">MAIN LAGI</button>
    </div>
  </section>

  <div id="controls" aria-label="Kontrol mobile">
    <button data-dir="up">↑</button>
    <button data-dir="left">←</button>
    <button data-dir="down">↓</button>
    <button data-dir="right">→</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
